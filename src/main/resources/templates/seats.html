<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공공도서관 열람실 실시간</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #f6f6f6;
        }

        .toolbar {
            margin: 12px 0;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .pager {
            margin: 12px 0;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .spacer {
            flex: 1;
        }

        input[type="number"] {
            width: 80px;
        }
    </style>
</head>
<body>
<h1>공공도서관 열람실 실시간</h1>

<form class="toolbar" th:action="@{/seats}" method="get">
    <!-- 항상 1페이지부터 -->
    <input type="hidden" name="pageNo" value="1"/>
    <!-- 업스트림(API) 한 페이지 크기 유지 -->
    <input type="hidden" name="numOfRows" th:value="${rawNumOfRows}"/>

    <input type="text" name="libName" placeholder="도서관명 (예: 중앙도서관)" th:value="${libName}">
    <input type="text" name="region" placeholder="지자체명 (예: 수원시)" th:value="${region}">
    <label>
        표시개수
        <input type="number" name="limit" min="1" th:value="${limit}">
    </label>

    <button type="submit">검색</button>

    <span class="spacer"></span>

    <!-- 초기화: 검색 파라미터를 비움 (업스트림 rows 유지) -->
    <a th:href="@{/seats(pageNo=1, numOfRows=${rawNumOfRows})}">초기화</a>
</form>

<table>
    <thead>
    <tr>
        <th>도서관</th>
        <th>지자체</th>
        <th>열람실</th>
        <th>방문자</th>
        <th>총좌석</th>
        <th>사용중</th>
        <th>예약</th>
        <th>잔여</th>
        <th>업데이트</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="it : ${items}">
        <td th:text="${it.libraryName}">도서관</td>
        <td th:text="${it.regionName}">지자체</td>
        <td th:text="${it.roomName}">열람실</td>
        <td th:text="${it.nowVisitorCount}">0</td>
        <td th:text="${it.totalSeats}">0</td>
        <td th:text="${it.usedSeats}">0</td>
        <td th:text="${it.reservedSeats}">0</td>
        <td th:text="${it.remainSeats}">0</td>
        <td th:text="${it.updatedAt}">2025-09-01 00:00:00</td>
    </tr>
    </tbody>
</table>

<div class="pager">
    <a th:if="${hasPrev}"
       th:href="@{/seats(
        pageNo=${prevPage},
        numOfRows=${rawNumOfRows},
        libName=${libName},
        region=${region},
        limit=${limit}
     )}">◀ 이전</a>

    <span th:text="${pageNo}">1</span>

    <a th:if="${hasNext}"
       th:href="@{/seats(
        pageNo=${nextPage},
        numOfRows=${rawNumOfRows},
        libName=${libName},
        region=${region},
        limit=${limit}
     )}">다음 ▶</a>

    <span th:text="'총 ' + ${totalCount} + '건'">총 0건</span>
</div>

</body>
</html>
