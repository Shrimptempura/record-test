<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공공도서관 열람실 실시간</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #f6f6f6;
        }

        .toolbar {
            margin: 12px 0;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .pager {
            margin: 12px 0;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .spacer {
            flex: 1;
        }

        input[type="number"] {
            width: 80px;
        }
    </style>
</head>
<body>
<h1>공공도서관 열람실 실시간</h1>

<form class="toolbar" th:action="@{/seats}" method="get">
    <input type="text" name="name" placeholder="도서관명 (예: 중앙도서관)" th:value="${name}">
    <input type="text" name="region" placeholder="지자체명 (예: 수원시)" th:value="${region}">
    <label>
        표시개수
        <input type="number" name="size" min="1" th:value="${size}">
    </label>
    <input type="hidden" name="page" value="1"/> <!-- 검색 시 1페이지로 -->
    <button type="submit">검색</button>

    <span class="spacer"></span>
</form>

<table>
    <thead>
    <tr>
        <th>도서관</th>
        <th>지자체</th>
        <th>열람실</th>
        <th>방문자</th>
        <th>총좌석</th>
        <th>사용중</th>
        <th>예약</th>
        <th>잔여</th>
        <th>업데이트</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="it : ${items}">
        <!-- SeatSnapshotView 필드명에 맞춤 -->
        <td th:text="${it.pblibNm}">도서관</td>
        <td th:text="${it.lclgvNm}">지자체</td>
        <td th:text="${it.rdrmNm}">열람실</td>
        <td th:text="${it.nowVstrCnt}">0</td>
        <td th:text="${it.tseatCnt}">0</td>
        <td th:text="${it.useSeatCnt}">0</td>
        <td th:text="${it.rsvtSeatCnt}">0</td>
        <td th:text="${it.rmndSeatCnt}">0</td>
        <td th:text="${it.updatedAt}">2025-09-01 00:00:00</td>
    </tr>
    </tbody>
</table>

<div class="pager">
    <a th:if="${hasPrev}" th:href="@{/seats(page=${prevPage}, size=${size}, name=${name}, region=${region})}">◀ 이전</a>
    <span th:text="${page}">1</span>
    <span>/</span>
    <span th:text="${totalPages}">1</span>
    <a th:if="${hasNext}" th:href="@{/seats(page=${nextPage}, size=${size}, name=${name}, region=${region})}">다음 ▶</a>
    <span class="spacer"></span>
    <span th:text="|총 ${total}건|">총 0건</span>
</div>

</body>
</html>
